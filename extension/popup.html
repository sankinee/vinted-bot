<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px/1.4 system-ui, sans-serif; background: #0b0f14; color: #e6edf3; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 8px 0; color: #8b98a8; }
  input[type=number] { width: 80px; background: #18202b; border: 1px solid #233041; color: #e6edf3; border-radius: 6px; padding: 4px 6px; }
  button { width: 100%; margin-top: 8px; padding: 8px; border-radius: 8px; border: 0; background: #00c2a8; color: #032a24; font-weight: 700; cursor: pointer; }
  button.ghost { background: #18202b; color: #e6edf3; border: 1px solid #233041; font-weight: 500; }
  .box { background: #121821; border: 1px solid #233041; border-radius: 10px; padding: 10px; margin-top: 10px; }
  .muted { color: #8b98a8; font-size: 12px; }
  ul { margin: 6px 0 0; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; gap: 6px; padding: 3px 0; word-break: break-all; }
  li a { color: #ff6b6b; cursor: pointer; text-decoration: none; }
  .on { color: #3fd17a; font-weight: 700; } .off { color: #ff6b6b; font-weight: 700; }
</style>
</head>
<body>
  <h1>Flipdar Bridge</h1>
  <div class="box">
    <label><span>Achat automatique</span><input id="enabled" type="checkbox"></label>
    <label>Max par article (€)<input id="maxPerItem" type="number" min="1" step="1"></label>
    <label>Budget par jour (€)<input id="dailyBudget" type="number" min="1" step="1"></label>
    <label>Achats max par jour<input id="maxPerDay" type="number" min="1" step="1"></label>
    <div class="muted" id="today"></div>
  </div>
  <div class="box">
    <div class="muted">Sites autorisés à déclencher des achats :</div>
    <ul id="trusted"></ul>
    <button id="trust">Autoriser ce site</button>
    <div class="muted" id="cur"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
